{% extends "base.html" %}
{% block title %}Route Planner - Pathick{% endblock %}

{% block content %}

<div class="flex h-[calc(100vh-64px)]">

```

</div>
{% endblock %}

{% block scripts %}

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let map;

let routeLine = null;
let startMarker = null;
let endMarker = null;

let currentLocation = null;

function initMap() {

    map = L.map("map").setView(
        [20.5937, 78.9629],
        5
    );

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution:
            "&copy; OpenStreetMap contributors",
            maxZoom: 19
        }
    ).addTo(map);

}

document
.getElementById("startType")
.addEventListener(
    "change",
    function(){

        const field =
        document.getElementById(
            "startLocation"
        );

        if(this.value === "manual"){
            field.classList.remove(
                "hidden"
            );
        }else{
            field.classList.add(
                "hidden"
            );
        }
    }
);

async function getCurrentLocation(){

    return new Promise(
        (resolve,reject)=>{

            navigator.geolocation
            .getCurrentPosition(

                position => {

                    const lat =
                    position.coords.latitude;

                    const lng =
                    position.coords.longitude;

                    currentLocation =
                    [lat,lng];

                    resolve(
                        [lat,lng]
                    );

                },

                error => {
                    reject(error);
                }

            );

        }
    );

}

async function getCoordinates(place){

    try{

        const response =
        await fetch(
            `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(place)}&limit=1`
        );

        const data =
        await response.json();

        if(
            !data ||
            data.length === 0
        ){
            return null;
        }

        return [

            parseFloat(
                data[0].lat
            ),

            parseFloat(
                data[0].lon
            )

        ];

    }
    catch(error){

        console.error(error);

        return null;
    }

}

async function getRoute(
    startCoords,
    endCoords
){

    const url =
    `https://router.project-osrm.org/route/v1/driving/${startCoords[1]},${startCoords[0]};${endCoords[1]},${endCoords[0]}?overview=full&geometries=geojson`;

    try{

        const response =
        await fetch(url);

        const data =
        await response.json();

        if(
            data.code !== "Ok"
        ){
            return null;
        }

        const route =
        data.routes[0]
        .geometry
        .coordinates
        .map(
            point => [
                point[1],
                point[0]
            ]
        );

        const distance =
        (
            data.routes[0]
            .distance / 1000
        );

        const duration =
        (
            data.routes[0]
            .duration / 3600
        );

        return {
            route,
            distance,
            duration
        };

    }
    catch(error){

        console.error(error);

        return null;

    }

}

async function calculateRoute(){

    const startType =
    document
    .getElementById(
        "startType"
    )
    .value;

    const destination =
    document
    .getElementById(
        "destination"
    )
    .value
    .trim();

    if(!destination){

        alert(
            "Please enter destination"
        );

        return;
    }

    let startCoords;

    let startName =
    "Current Location";

    if(
        startType ===
        "current"
    ){

        try{

            startCoords =
            await getCurrentLocation();

        }
        catch{

            alert(
                "Unable to access current location"
            );

            return;
        }

    }
    else{

        startName =
        document
        .getElementById(
            "startLocation"
        )
        .value
        .trim();

        if(!startName){

            alert(
                "Enter start location"
            );

            return;
        }

        startCoords =
        await getCoordinates(
            startName
        );

        if(
            !startCoords
        ){

            alert(
                "Start location not found"
            );

            return;
        }

    }

    const endCoords =
    await getCoordinates(
        destination
    );

    if(
        !endCoords
    ){

        alert(
            "Destination not found"
        );

        return;
    }

    const routeInfo =
    await getRoute(
        startCoords,
        endCoords
    );

    if(
        !routeInfo
    ){

        alert(
            "Route not found"
        );

        return;
    }

    if(routeLine){

        map.removeLayer(
            routeLine
        );

    }

    if(startMarker){

        map.removeLayer(
            startMarker
        );

    }

    if(endMarker){

        map.removeLayer(
            endMarker
        );

    }

    startMarker =
    L.marker(
        startCoords
    )
    .addTo(map)
    .bindPopup(
        startName
    );

    endMarker =
    L.marker(
        endCoords
    )
    .addTo(map)
    .bindPopup(
        destination
    );

    routeLine =
    L.polyline(
        routeInfo.route,
        {
            color:"#06b6d4",
            weight:6,
            opacity:0.9
        }
    ).addTo(map);

    map.fitBounds(
        routeLine.getBounds()
    );

    document
    .getElementById(
        "routeInfo"
    )
    .classList
    .remove(
        "hidden"
    );

    document
    .getElementById(
        "routeInfo"
    )
    .innerHTML = `

        <h3 class="font-semibold text-lg mb-3">
            Route Information
        </h3>

        <div class="space-y-2">

            <div>
                <strong>
                    Start:
                </strong>
                ${startName}
            </div>

            <div>
                <strong>
                    Destination:
                </strong>
                ${destination}
            </div>

            <div>
                <strong>
                    Distance:
                </strong>
                ${routeInfo.distance.toFixed(2)}
                km
            </div>

            <div>
                <strong>
                    Travel Time:
                </strong>
                ${routeInfo.duration.toFixed(2)}
                hours
            </div>

        </div>

    `;

}

async function locateMe(){

    try{

        const coords =
        await getCurrentLocation();

        map.flyTo(
            coords,
            13
        );

    }
    catch{

        alert(
            "Unable to access current location"
        );

    }

}

initMap();

</script>

{% endblock %}
